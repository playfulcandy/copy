<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Code Copy</title>
    
    <!-- iPhone Web App Magic -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Code Copy">
    
    <!-- Link to the Manifest and App Icon -->
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon.png">

<style>
  body {
    margin: 0;
  }
  .full-green-btn {
    width: 100vw;
    height: 100vh;
    background-color: #22c55e;
    color: white;
    border: none;
    cursor: pointer;
    
    /* Center the text perfectly */
    display: flex;
    justify-content: center;
    align-items: center;
    
    /* Make text fill roughly 15% of the screen width */
    font-size: 15vw; 
    font-weight: bold;
    text-transform: uppercase;
  }
  .full-green-btn:hover {
    background-color: #16a34a;
  }
  .full-blue {
    width: 100vw;
    height: 100vh;
    background-color: #225ec5;
    color: white;
    border: none;
    cursor: pointer;
    
    /* Center the text perfectly */
    display: flex;
    justify-content: center;
    align-items: center;
    
    /* Make text fill roughly 15% of the screen width */
    font-size: 15vw; 
    font-weight: bold;
    text-transform: uppercase;
  }
</style>

</head>
<body>
    <button id="copyBtn" class="full-green-btn">Copy Code</button>

    <script>
        document.getElementById('copyBtn').addEventListener('click', () => {
            navigator.clipboard.writeText(window.location.href.split('code=').pop())
                .then(() => {
                    document.body.innerHTML = (`
                        <div class="full-blue">COPIED</div>
                    `);
                })
                .catch(err => alert('Error copying: ' + err));
        });
    </script>
</body>
</html>
