<!DOCTYPE html>
<html>
<head>
    <title>Click to Copy</title>

<style>
  body {
    margin: 0;
  }
  .full-green-btn {
    width: 100vw;
    height: 100vh;
    background-color: #22c55e;
    color: white;
    font-size: 2rem;
    border: none;
    cursor: pointer;
  }
  .full-green-btn:hover {
    background-color: #16a34a;
  }
</style>

</head>
<body>
    <button id="copyBtn">Copy Code</button>

    <script>
        document.getElementById('copyBtn').addEventListener('click', () => {
            navigator.clipboard.writeText(window.location.href.split('code=').pop())
                .then(() => alert('Copied to clipboard!'))
                .catch(err => alert('Error copying: ' + err));
        });
    </script>
</body>
</html>
