<!DOCTYPE html>
<html>
<head>
    <title>Click to Copy</title>
</head>
<body>
    <script>
        navigator.clipboard.writeText(window.location.href.split('code=').pop())
                .then(() => alert('Copied to clipboard!'))
                .catch(err => alert('Error copying: ' + err));
    </script>
</body>
</html>
